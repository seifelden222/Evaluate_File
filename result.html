<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Name - Result</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous" />
  </head>
  <body>
    <header class="site-header py-3 bg-white shadow-sm">
      <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light p-0">
          <a class="navbar-brand d-flex align-items-center" href="index.html">
            <div class="logo-circle me-2">M</div>
            <span class="h5 mb-0">Project Name</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container my-5">
      <div class="card shadow-lg p-4">
        <h5 class="mb-3 text-center text-info">Submission Result</h5>

        <div id="result-area" class="row g-3">
          <!-- populated by JS -->
        </div>

        <div class="text-center mt-4">
          <a id="text-link" href="index.html" class="btn btn-outline-primary">Back</a>
        </div>
      </div>
    </main>

  <!-- DOMPurify for sanitizing server-returned HTML before injection -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
  <script>
      (function () {
        function decode(v) {
          try { return decodeURIComponent(v.replace(/\+/g, ' ')); } 
          catch (e) { return v; }
        }
        function safeText(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        const area = document.getElementById('result-area');

        // Try to read server response from sessionStorage first (set by main.js)
        let serverData = null;
        let serverHtml = null;
        try {
          serverHtml = sessionStorage.getItem('uploadResultHtml');
        } catch (e) {
          console.warn('Could not read uploadResultHtml from sessionStorage', e);
        }
        try {
          const raw = sessionStorage.getItem('uploadResult');
          if (raw) serverData = JSON.parse(raw);
        } catch (e) {
          console.warn('Could not read uploadResult from sessionStorage', e);
          serverData = null;
        }

        // If server returned HTML, sanitize and display it immediately then stop
        if (serverHtml) {
          try {
            const clean = DOMPurify.sanitize(serverHtml, {ALLOWED_URI_REGEXP: /^(?:(?:http|https|mailto):|[^a-z]|[#\/])/i});
            area.innerHTML = '<div class="col-12">' + clean + '</div>';
            // done
            return;
          } catch (e) {
            console.error('Failed to sanitize/insert server HTML', e);
            // continue to fallback rendering
          }
        }

        // Start polling for score report if we got a "processing" status
        if (serverData && serverData.status === 'processing') {
          area.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div><p class="mt-3 text-muted">جاري معالجة الملف... برجاء الانتظار</p></div>';
          
          let pollAttempts = 0;
          const maxAttempts = 60; // Try for 60 seconds max
          
          const pollInterval = setInterval(async function() {
            pollAttempts++;
            
            try {
              const resp = await fetch('https://mohammedaboelela.pythonanywhere.com/get_score');
              
              if (!resp.ok) {
                console.warn('Score not ready yet, attempt:', pollAttempts);
                
                if (pollAttempts >= maxAttempts) {
                  clearInterval(pollInterval);
                  area.innerHTML = '<div class="col-12"><div class="alert alert-warning">⚠️ استغرقت المعالجة وقتاً أطول من المتوقع. برجاء المحاولة مرة أخرى أو التواصل مع الدعم الفني.</div></div>';
                }
                return;
              }
              
              const contentType = (resp.headers && resp.headers.get && resp.headers.get('content-type')) || '';
              
              // If we got HTML, it's ready!
              if (contentType.indexOf('text/html') !== -1) {
                const html = await resp.text();
                const clean = DOMPurify.sanitize(html, {ALLOWED_URI_REGEXP: /^(?:(?:http|https|mailto):|[^a-z]|[#\/])/i});
                area.innerHTML = '<div class="col-12">' + clean + '</div>';
                clearInterval(pollInterval);
                console.log('✅ Score report loaded successfully');
                return;
              }
              
              // If still processing, continue polling
              const data = await resp.json();
              if (data.status !== 'processing') {
                // Got some other response, display it
                clearInterval(pollInterval);
                renderJson(data);
              }
              
            } catch (err) {
              console.error('Polling error:', err);
              if (pollAttempts >= maxAttempts) {
                clearInterval(pollInterval);
                area.innerHTML = '<div class="col-12"><div class="alert alert-danger">❌ حدث خطأ أثناء تحميل النتيجة. برجاء المحاولة مرة أخرى.</div></div>';
              }
            }
          }, 1000); // Poll every 1 second
          
          return ; // Exit here, polling will handle the rest
        }

        // Build params from session JSON (if available) or URL query string
        const params = {};
        if (serverData) {
          // leave params empty; renderJson will use serverData directly below
        } else {
          const qs = (window.location.search || '').replace(/^\?/, '');
          if (qs) {
            qs.split('&').forEach(function (pair) {
              if (!pair) return;
              const parts = pair.split('=');
              const key = decode(parts[0] || '').trim();
              const val = decode(parts[1] || '');
              if (!key) return;
              params[key] = val;
            });
          }
        }

        function renderJson(obj) {
          if (!obj) return;
          // Pretty-print known keys first
          if (obj.file) area.appendChild(makeRow('File Name', safeText(String(obj.file).split('\\').pop().split('/').pop())));
          if (obj.fileType) area.appendChild(makeRow('File Type', safeText(obj.fileType)));
          if (obj.name) area.appendChild(makeRow('Name', safeText(obj.name)));
          if (obj.phone) area.appendChild(makeRow('Phone', safeText(obj.phone)));
          if (obj.note) area.appendChild(makeRow('Note', '<div style="white-space:pre-wrap">' + safeText(obj.note) + '</div>'));

          // Append the full JSON for inspection
          const jsonPre = document.createElement('pre');
          jsonPre.textContent = JSON.stringify(obj, null, 2);
          area.appendChild(makeRow('Server JSON', jsonPre.outerHTML));
        }
        function makeRow(label, valueHtml) {
          const col = document.createElement('div');
          col.className = 'col-12';
          col.innerHTML = '<div class="d-flex align-items-start gap-3">' +
            '<div style="min-width:130px;font-weight:600;color:#0d6efd">' + safeText(label) + '</div>' +
            '<div class="flex-grow-1">' + valueHtml + '</div>' +
            '</div>';
          return col;
        }

        if (serverData) {
          renderJson(serverData);
        } else {
          const name = params.name || '';
          const phone = params.phone || '';
          const note = params.note || '';
          const file = params.file || '';
          const fileType = params.fileType || '';

          if (!file) {
            area.appendChild(makeRow('', '<span class="text-muted">No file data found.</span>'));
          } else {
            const fileDisplay = safeText(file.split('\\').pop().split('/').pop());
            area.appendChild(makeRow('File Name', fileDisplay));
            if (fileType) area.appendChild(makeRow('File Type', safeText(fileType)));
            
            // Uncomment below to display name, phone, note:
            // if (name) area.appendChild(makeRow('Name', safeText(name)));
            // if (phone) area.appendChild(makeRow('Phone', safeText(phone)));
            // if (note) {
            //   const noteHtml = '<div style="white-space:pre-wrap">' + safeText(note) + '</div>';
            //   area.appendChild(makeRow('Note', noteHtml));
            // }
          }
        }
      })();
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
  </body>
</html>
