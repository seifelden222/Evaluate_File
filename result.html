<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Name - Result</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous" />
  </head>
  <body>
    <header class="site-header py-3 bg-white shadow-sm">
      <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light p-0">
          <a class="navbar-brand d-flex align-items-center" href="index.html">
            <div class="logo-circle me-2">M</div>
            <span class="h5 mb-0">Project Name</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container my-5">
      <div class="card shadow-lg p-4">
        <h5 class="mb-3 text-center text-info">Submission Result</h5>

        <div id="result-area" class="row g-3">
          <!-- populated by JS -->
        </div>

        <div class="text-center mt-4">
          <a id="text-link" href="index.html" class="btn btn-outline-primary">Back</a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        function decode(v) {
          try { return decodeURIComponent(v.replace(/\+/g, ' ')); } 
          catch (e) { return v; }
        }
        function safeText(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        const params = {};
        const qs = window.location.search.replace(/^\?/, '');
        if (qs) {
          qs.split('&').forEach(function (pair) {
            const parts = pair.split('=');
            const key = decode(parts[0] || '').trim();
            const val = decode(parts[1] || '');
            if (!key) return;
            params[key] = val;
          });
        }

        const area = document.getElementById('result-area');
        function makeRow(label, valueHtml) {
          const col = document.createElement('div');
          col.className = 'col-12';
          col.innerHTML = '<div class="d-flex align-items-start gap-3">' +
            '<div style="min-width:130px;font-weight:600;color:#0d6efd">' + safeText(label) + '</div>' +
            '<div class="flex-grow-1">' + valueHtml + '</div>' +
            '</div>';
          return col;
        }

        const name = params.name || '';
        const phone = params.phone || '';
        const note = params.note || '';
        const file = params.file || '';
        const fileType = params.fileType || '';

        if (!file) {
          area.appendChild(makeRow('', '<span class="text-muted">No file data found.</span>'));
        } else {
          const fileDisplay = safeText(file.split('\\').pop().split('/').pop());
          area.appendChild(makeRow('File Name', fileDisplay));
          if (fileType) area.appendChild(makeRow('File Type', safeText(fileType)));
          
          // Uncomment below to display name, phone, note:
          // if (name) area.appendChild(makeRow('Name', safeText(name)));
          // if (phone) area.appendChild(makeRow('Phone', safeText(phone)));
          // if (note) {
          //   const noteHtml = '<div style="white-space:pre-wrap">' + safeText(note) + '</div>';
          //   area.appendChild(makeRow('Note', noteHtml));
          // }
        }
      })();
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
  </body>
</html>
